name: Provision Infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform-provision.yml'
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform-provision.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev

# Prevent concurrent runs for the same environment
concurrency:
  group: terraform-${{ github.workflow }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: true
  TF_CLI_ARGS_plan: -compact-warnings

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Terraform Init
        id: init
        working-directory: environments/${{ matrix.environment }}
        run: |
          # Initialize with backend configuration
          # The backend config is in the terraform block, but we may need to provide
          # additional backend config via -backend-config flags for dynamic values
          
          # Check if backend variables are set (indicates remote state)
          if [ -n "${{ vars.TERRAFORM_STATE_BUCKET }}" ]; then
            echo "Using remote S3 backend"
            terraform init \
              -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
              -backend-config="key=environments/${{ matrix.environment }}/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="use_lockfile=true" \
              -backend-config="encrypt=true"
          else
            echo "Using local backend (development mode)"
            terraform init
          fi

      - name: Terraform Validate
        id: validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          # Set backend-related variables if using remote state
          if [ -n "${{ vars.TERRAFORM_STATE_BUCKET }}" ]; then
            export TF_VAR_terraform_state_bucket="${{ vars.TERRAFORM_STATE_BUCKET }}"
            export TF_VAR_terraform_state_key="environments/${{ matrix.environment }}/terraform.tfstate"
          fi
          
          # Set environment variable
          export TF_VAR_environment="${{ matrix.environment }}"
          export TF_VAR_region="${{ env.AWS_REGION }}"
          
          terraform plan -no-color -input=false -out=tfplan -detailed-exitcode || echo "exitcode=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout || 'Plan output not available' }}
        with:
          script: |
            const output = `#### Terraform Plan - ${{ matrix.environment }} 📖
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Summary
        if: always()
        run: |
          echo '## Terraform Plan Summary' >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ vars.TERRAFORM_STATE_BUCKET && 'Remote (S3)' || 'Local' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Init: ${{ steps.init.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Validate: ${{ steps.validate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Plan: ${{ steps.plan.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo '### Modules' >> $GITHUB_STEP_SUMMARY
          echo "- Modules detected automatically" >> $GITHUB_STEP_SUMMARY

      - name: Report Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const steps = [
              { name: 'Terraform Init', outcome: '${{ steps.init.outcome }}' },
              { name: 'Terraform Validate', outcome: '${{ steps.validate.outcome }}' },
              { name: 'Terraform Plan', outcome: '${{ steps.plan.outcome }}' }
            ];
            const failed = steps.find(s => s.outcome === 'failure');
            const stepName = failed ? failed.name : 'Unknown step';
            const logs = '${{ steps.plan.outputs.stderr || steps.plan.outputs.stdout || 'No output captured' }}';
            const lines = logs.split('\n');
            const last50 = lines.slice(-50).join('\n');
            
            const body = `#### :x: Terraform Failure - ${{ matrix.environment }}
            
            **Failed Step:** ${stepName}
            **Exit Code:** 1
            
            <details><summary>Last 50 lines of output</summary>
            
            \`\`\`
            ${last50}
            \`\`\`
            
            </details>
            
            *Workflow: ${{ github.workflow }} | Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment:
          - dev
    environment:
      name: ${{ matrix.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: |
          # Initialize with same backend configuration as plan job
          if [ -n "${{ vars.TERRAFORM_STATE_BUCKET }}" ]; then
            echo "Using remote S3 backend"
            terraform init \
              -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
              -backend-config="key=environments/${{ matrix.environment }}/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="use_lockfile=true" \
              -backend-config="encrypt=true"
          else
            echo "Using local backend (development mode)"
            terraform init
          fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}

      - name: Terraform Apply
        working-directory: environments/${{ matrix.environment }}
        run: |
          # Set backend-related variables if using remote state
          if [ -n "${{ vars.TERRAFORM_STATE_BUCKET }}" ]; then
            export TF_VAR_terraform_state_bucket="${{ vars.TERRAFORM_STATE_BUCKET }}"
            export TF_VAR_terraform_state_key="environments/${{ matrix.environment }}/terraform.tfstate"
          fi
          
          # Set environment variable
          export TF_VAR_environment="${{ matrix.environment }}"
          export TF_VAR_region="${{ env.AWS_REGION }}"
          
          terraform apply -auto-approve -input=false tfplan

      - name: Summary
        if: always()
        run: |
          echo '## Terraform Apply Summary' >> $GITHUB_STEP_SUMMARY
          echo "- Project: 3ef22852-4e08-49d4-907e-7e53d5bdc149" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ vars.TERRAFORM_STATE_BUCKET && 'Remote (S3)' || 'Local' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
